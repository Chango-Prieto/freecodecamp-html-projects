<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Check Out Page</title>
    </head>
    <body>
        <h1>Check Out</h1>

        <section>
            <h2>Your Cart</h2>

            <img 
            src="https://http2.mlstatic.com/D_NQ_NP_2X_917130-MLM32658078937_102019-F.jpg"
            alt="Pantuflas de Bolillo">

        </section>

        <section>
            <h2>Payment Information</h2>

            <form>
                <label for="card-name">Your Name <span>*</span></label>
                <input 
                id="card-name" 
                name="card-name"
                type="text"
                placeholder="Benito Camelas"
                required>

                <label for="card-number">Credit Card Number <span>*</span></label>
                <input
                id="card-number"
                name="card-number"
                type="text"
                placeholder="6967-0420-8008"
                required>

                <label for="expiry-date">Expiry Date <span>*</span></label>
                <input
                id="expiry-date"
                name="expiry-date"
                type="text"
                placeholder="MM/YY"
                required>

                <label for="cvv-number">CVV <span>*</span></label>
                <input
                id="cvv-number"
                name="cvv-number"
                type="text"
                placeholder="123"
                required>
            </form>
        </section>
    </body>
</html>
