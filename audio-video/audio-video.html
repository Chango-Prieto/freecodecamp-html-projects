<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>Audio/Video Player</title>
    </head>
    <body>
        <h1>
            Audio & Video Player
        </h1>

        <section>
            <h2>Mario Loves You</h2>
            <video
            controls
            width="640">
                <source
                src="https://www.youtube.com/watch?v=KEqDqjjTqRk"
                type="video/mp4">
            </video>
        </section>

        <section>
            <h2>Title of Song</h2>
            <audio
            controls
            loop
            src=""
            ></audio>
        </section>
    </body>
</html>
